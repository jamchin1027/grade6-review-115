/* Multi-school paper library and extended practice. */
.drill-panel{padding:26px;background:#edf4ec;border:1px solid #cbdcc9;border-radius:22px;margin:20px 0 26px}
.drill-panel .section-header{align-items:flex-start;margin-bottom:18px}
.drill-panel h2{font-size:25px;margin:5px 0 8px}
.bank-count{font-size:42px;font-weight:800;color:#23523d;line-height:1.1;text-align:center;padding-left:20px}
.bank-count small{display:block;font-size:12px;margin-top:7px;font-weight:500}
.drill-fields,.catalog-filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.drill-fields label,.catalog-filters label{font-size:13px;font-weight:700;display:flex;flex-direction:column;gap:7px;min-width:0}
select{width:100%;min-width:0;font:inherit;font-weight:400;padding:12px 10px;background:white;color:#173e36;border:1px solid #bacdbb;border-radius:9px;min-height:46px}
select:focus-visible{outline:3px solid #729b74;outline-offset:2px}
.drill-start{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-top:20px}
.drill-start p{font-size:14px;margin:0}
.fineprint{font-size:12px!important;line-height:1.8;color:#536354}
.paper-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.paper-card{padding:22px;border:1px solid #d5ded0;border-radius:16px;background:#fff;min-width:0}
.paper-card h3{font-size:18px;margin:12px 0 8px}
.paper-card p{font-size:14px;line-height:1.85;color:#52634f}
.paper-tags{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.paper-kind{font-size:12px;color:#6c674b}
.paper-practice{margin-top:15px;border:0;background:#e8f1e5;color:#244c34;font:inherit;font-size:13px;padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left}
.paper-practice:hover{background:#d3e5ce}
.catalog-filters{margin:23px 0 12px}
.competition-note{background:#fff4da;border-left:4px solid #bd8c2e;padding:18px 22px;margin:26px 0 16px;border-radius:6px}
.competition-note h3{margin:0 0 8px}.competition-note p{line-height:1.85;margin:8px 0}.competition-note a{color:#775119}
.reference-details{margin-top:24px;border-top:1px solid #ccd7c4;padding-top:16px;line-height:1.8}
.reference-details summary{cursor:pointer;font-weight:700}
.question-source{font-size:12px;line-height:1.85;color:#536552;border-top:1px solid #dce3d6;padding-top:12px;margin-top:18px}
.question-source a{color:#235d43;text-decoration:underline;text-underline-offset:3px}
.option.selected{background:#edf1f8;border-color:#7186a4;color:#304764}
.attempt-review{margin-top:26px}.attempt-review>p{line-height:1.8;color:#5d695b}
.review-item{background:#fff;border:1px solid #d8dfd1;border-left:4px solid #77936d;border-radius:12px;padding:24px;margin-bottom:16px;line-height:1.85}
.review-item.is-wrong{border-left-color:#bd7b38}.review-item h3{font-size:18px;margin:10px 0}.review-item p{margin:7px 0}

@media(max-width:640px){.drill-panel{padding:18px}.drill-fields,.catalog-filters,.paper-grid{grid-template-columns:1fr}.drill-start{align-items:stretch;flex-direction:column}.bank-count{font-size:30px}.paper-card{padding:18px}.paper-tags{flex-direction:column;gap:6px}.review-item{padding:18px}.drill-panel .section-header{display:block}.bank-count{display:none}}

<script data-bundled-from="data.js">
window.LESSONS = [
 {id:'chi-1',subject:'國語',unit:'第 1 課',title:'在天晴了的時候',accent:'green',sub:'新詩 × 雨後觀察',goal:'從雨後的小路出發，練習抓住感官線索，讀出景物的活力。',points:[['讀景路線','由泥路、小草、白菊到鳳蝶，視線跟著詩句移動，畫面由近到遠。'],['感官線索','找出看見的顏色、形狀與動作；作者也用觸覺、想像，讓雨後世界變得鮮明。'],['擬人與想像','把景物寫得像會說話、會行動，讀起來更有生命感。'],['閱讀提醒','新詩不一定要押韻；讀節奏、重複和停頓，也能幫助理解情緒。']],cards:[['雨後景物怎麼讀？','圈出景物、顏色、動作，再想像鏡頭如何移動。'],['把景物寫活的技巧？','擬人：讓景物像人一樣有動作或情感。'],['觀察景色要記什麼？','位置、感官細節、變化與自己的感受。']],questions:[['詩裡把小草寫得像有自己的活力，最可能運用了什麼方法？',['擬人','列數字','引用資料','因果說明'],0,'把景物寫出像人的動作或神情，就是擬人。'],['要把放學路上的雨後景色寫成新詩，哪個素材最有幫助？',['只寫「很漂亮」','觀察水珠、氣味、光線和小生物的動作','先找押韻的字，不用觀察','抄一段別人的文章'],1,'先蒐集具體感官線索，讀者才看得到你看到的風景。']]},
 {id:'chi-2',subject:'國語',unit:'第 2 課',title:'珍珠鳥',accent:'green',sub:'散文 × 信任的建立',goal:'看懂作者如何用安靜、照顧與尊重，慢慢贏得小鳥的信任。',points:[['關係變化','小鳥由害怕、探看、靠近，到自在停留；留意每一次距離的改變。'],['作者怎麼做','提供安全環境，不急著追摸；讓小鳥保有選擇與退開的空間。'],['因果推論','「不打擾」讓小鳥安心，安心才敢探索；信任是長時間累積的。'],['主旨想一想','關係需要尊重和耐心。讀故事時用行動證據支持主旨，不只背一句話。']],cards:[['小鳥為何慢慢靠近？','牠反覆觀察後，發現環境安全、作者不逼迫牠。'],['怎樣找角色心情？','看牠的動作、距離、反應，再連結情境推論。'],['信任可以命令出來嗎？','不行；要有安全感、尊重界線並長期相處。']],questions:[['小鳥從籠邊探頭到自在停在作者身旁，最合理的推論是什麼？',['牠突然忘了害怕','牠觀察到作者不會傷害牠，逐漸安心','作者把牠訓練成比賽冠軍','牠正在找食物以外的東西'],1,'用前後行為的改變，推想安全感是逐步建立的。'],['和怕生的小動物相處，哪個做法最能建立信任？',['追著牠抱起來','讓牠有安全空間，自行決定靠近','大聲呼叫牠','拿走牠躲藏的地方'],1,'尊重界線、提供安全感，才有信任的基礎。']]},
 {id:'chi-3',subject:'國語',unit:'第 3 課',title:'客至',accent:'green',sub:'古詩 × 待客心情',goal:'從門前景物與待客安排，讀出詩人迎接朋友的欣喜和真誠。',points:[['作者與情境','杜甫寫朋友來訪，屋旁環境清幽，平日少有人來。'],['景物有作用','「花徑」「蓬門」不只描寫環境，也襯托來客難得、主人歡喜。'],['待客細節','主人忙著備酒、邀鄰作伴；物品簡樸，待客心意真誠。'],['讀古詩','先看誰來、在哪裡、做什麼，再把景物與人物心情連起來。']],cards:[['《客至》的作者？','杜甫。'],['景物描寫怎麼幫助理解？','看環境平日的冷清，對照好友到訪的喜悅。'],['詩中的待客特色？','家常簡樸，卻真誠熱情。']],questions:[['平常少有人來，今天好友登門，最能襯托什麼？',['主人不喜歡客人','這次相聚格外難得而令人歡喜','住家一定非常豪華','朋友走錯了路'],1,'日常冷清與今日訪客形成對照，凸顯喜悅。'],['詩人忙著備酒並邀鄰居同來，最能看出什麼？',['不想和朋友說話','想把相聚分享，真心款待朋友','在舉辦正式宴會','忘記朋友不喝酒'],1,'從行動推論人物心意，不必把場面想得奢華。']]},
 {id:'chi-4',subject:'國語',unit:'第 4 課',title:'贏得喝采的輸家',accent:'green',sub:'故事 × 誠信與運動家精神',goal:'跟著安納亞的內心拉扯，思考公平、勝負和誠信。',points:[['比賽轉折','領先的穆太誤把拱門當終點；安納亞知道正確位置，也有機會超前。'],['內心衝突','想得第一，卻知道對方若沒弄錯，本來會先抵達；於是重新想「公平的勝利」是什麼。'],['關鍵行動','安納亞提醒穆太繼續向前，讓比賽回到公平。'],['主旨','名次不是衡量一切的標準；誠實和運動家精神也值得掌聲。用「選擇＋理由」說明，不只背標語。']],cards:[['安納亞為什麼猶豫？','他渴望勝利，也明白對手只是弄錯終點；直接超前是否公平？'],['誰先到終點？','穆太先到；安納亞的提醒讓他完成原本領先的比賽。'],['從故事怎麼找主旨？','連結人物的選擇、原因和結果。']],questions:[['安納亞提醒穆太正確終點，最主要的原因是什麼？',['想讓比賽中斷','知道對方一直領先，想維護公平','不想得到任何名次','怕觀眾太吵'],1,'他衡量勝負以外的公平，知道提醒才符合比賽精神。'],['故事中的「輸家」為什麼也贏得喝采？',['他獲得最多獎牌','他選擇誠實公平，表現出高貴的運動家精神','他沒有參加比賽','終點被取消了'],1,'題目用反差引導思考：名次輸了，品格卻得到肯定。']]},
 {id:'chi-5',subject:'國語',unit:'第 5 課',title:'哇！原來如此',accent:'green',sub:'說明文 × 把原因說清楚',goal:'用「問題—原理—證據—作用」讀懂生活職業裡的小祕密。',points:[['文章結構','每一小節先提出「為什麼」，再說明工具或做法的原理，最後補充用途。'],['例子一：耳機','表演者用監聽耳機聽伴奏和自己的聲音，幫助掌握演唱。'],['例子二：消防衣','多層設計有反射、阻隔等不同功能，保護消防員；不是完全不怕火。'],['例子三：場記板','留下場次線索並用拍板聲協助對齊影像與聲音，方便後製同步。'],['閱讀科普','把關鍵詞和因果連線；不要把「爭取時間保護」誤讀成「永遠不會受傷」。']],cards:[['讀一段說明文找哪四項？','問題、原理、證據或細節、作用。'],['場記板有什麼用途？','標示拍攝資訊並提供聲音提示，協助影音同步。'],['消防衣是完全不怕火嗎？','不是；材料分層可隔熱防護，但保護有條件和限制。']],questions:[['拍電影時打場記板，最重要的用途之一是什麼？',['幫演員記台詞','提供場次資訊與聲音提示，方便影音對齊','讓攝影機變快','替電影加背景音樂'],1,'場記板的拍板聲能成為聲畫同步的線索。'],['科普文章說消防衣能保護消防員，最準確的理解是什麼？',['穿上後任何火災都不會受傷','分層材料可提供隔熱等保護，但仍要遵守安全限制','消防衣會把火完全消滅','所有衣物都和消防衣一樣'],1,'科學說明要注意條件與範圍，不要把「降低風險」誇大成「完全安全」。']]},
 {id:'chi-6',subject:'國語',unit:'第 6 課',title:'登月先鋒',accent:'green',sub:'人物傳記 × 按時間整理',goal:'整理阿姆斯壯如何由飛行興趣一路準備，完成登月任務。',points:[['時間線','童年對飛行著迷 → 學習航空 → 接受太空訓練 → 執行阿波羅任務 → 返回地球。'],['人物特質','持續學習、接受訓練、冷靜合作；重大成果背後有很多人的準備。'],['寫作方法','依時間順序交代事件，再用環境和感官描寫呈現登月景象。'],['辨認事實','抓住年份、人物、任務、結果；先分清事件順序，再談感受。']],cards:[['傳記時間線的用處？','把人物經歷依先後排好，理解夢想如何一步步實現。'],['完成重大任務靠一個人嗎？','需要個人準備，也需要團隊合作與長期科技累積。'],['閱讀時如何辨認重要事件？','標記時間、行動、遇到的挑戰和結果。']],questions:[['讀人物傳記時，哪一種整理方式最容易看出成長歷程？',['將事件按時間順序排成時間線','只抄最後一句','把所有年份刪掉','只看景物形容詞'],0,'時間線能看出興趣、準備、挑戰到成果的先後關係。'],['文章描述登月任務時，除了太空人的努力，也要注意什麼？',['任務需要許多人的合作和科技準備','只有運氣能完成','太空人不需要訓練','月球上有空氣可直接呼吸'],0,'大型科學任務仰賴團隊合作、工程與訓練。']]},
 {id:'sci-1',subject:'自然',unit:'第 1 單元',title:'探索天氣的變化',accent:'blue',sub:'康軒版 × 天氣觀察家',goal:'看雲、讀資料、找線索，練習解釋天氣如何改變。',points:[['天氣元素','觀察氣溫、雲量、風向風速、降雨等；描述天氣要註明時間和地點。'],['水在大氣中','水蒸氣遇冷凝結成小水滴或冰晶；雲霧由細小水滴或冰晶形成，水滴或冰晶長大後可能降水。'],['預報靠資料','比較不同時間、地點的觀測資料和天氣圖，才能推估天氣；雲圖只是線索之一。'],['氣候與天氣','天氣是短時間狀況；氣候是較長時間的平均特徵。'],['氣候變遷','觀察長期趨勢與多種資料，不用單一天氣事件就下結論。']],cards:[['天氣和氣候差在哪？','天氣看短時間；氣候看長時期的平均與變化。'],['雲是什麼形成的？','空氣中的水蒸氣冷卻凝結成小水滴或冰晶。'],['預測天氣只看一片雲可以嗎？','不夠；要綜合觀測資料與不同時間的變化。']],questions:[['今天下午忽然下了一場雨，這是描述什麼？',['當地短時間的天氣','當地數十年的氣候','地球公轉','海水鹽度'],0,'單次、短時間的狀況屬於天氣。'],['判斷一地氣候是否改變，較可靠的方法是什麼？',['只看某一天熱不熱','蒐集長時間、多種氣象資料比較趨勢','問一位路人記憶','看一張沒有日期的照片'],1,'氣候談長期趨勢，需要足夠時間和多種資料。']]},
 {id:'sci-2',subject:'自然',unit:'第 2 單元',title:'水溶液',accent:'blue',sub:'康軒版 × 溶液偵探',goal:'找出溶進水裡的物質，並用觀察與公平實驗解開水溶液的性質。',points:[['溶解不等於消失','糖或鹽溶進水後仍在溶液中；可用蒸發水分等方法找回溶質。'],['溶質與溶劑','溶解的物質稱溶質，能溶解其他物質的液體稱溶劑；混合後形成溶液。'],['公平比較','每次只改變一個條件，例如溶質種類；水量、器材、測量方法盡量相同。'],['導電實驗','用電路檢測水溶液導電性。不同水溶液結果可能不同；不可直接用插座或市電測試。'],['酸鹼指示劑','用石蕊試紙等指示劑觀察顏色，判斷酸性或鹼性；不同指示劑有自己的變色規則。'],['酸鹼能改變','混合酸性與鹼性水溶液可能改變酸鹼性；結果需用指示劑測量，不能只憑顏色猜。']],cards:[['溶質溶解後去哪裡？','分散在溶液中，沒有消失；適當方法可把它分離出來。'],['怎樣做公平實驗？','控制其他條件，只改變一個要研究的條件。'],['酸鹼性怎麼知道？','使用合適的指示劑觀察變色，並依該指示劑規則判斷。']],questions:[['糖水蒸發後，杯底留下糖，說明什麼？',['糖在水裡完全消失','糖仍在溶液中，只是平常看不見','水變成糖','蒸發會製造糖'],1,'溶解使溶質分散，不代表物質消失。'],['比較兩種水溶液是否導電時，哪種做法較公平？',['每種用不同水量和不同電池','固定水量、器材和電路，只更換水溶液','用手摸電線判斷','把所有溶液混在一起'],1,'控制其他條件，才知道結果差異來自溶液種類。'],['想測試水溶液酸鹼性，最適合使用什麼？',['石蕊試紙等酸鹼指示劑','尺','指南針','溫度計'],0,'指示劑會依酸鹼性產生可觀察的顏色變化。']]},
 {id:'soc-1',subject:'社會',unit:'第 1 單元',title:'日治時期臺灣的發展與變遷',accent:'orange',sub:'南一版 × 歷史線索員',goal:'從制度、建設和生活三個角度，觀察殖民統治如何改變臺灣。',points:[['時代背景','1895年清朝依馬關條約將臺灣、澎湖割讓給日本；1945年日本戰敗後結束統治。'],['統治措施','日本建立行政與警察制度、調查土地與人口、推行教育等；要分辨措施、目的與人民感受。'],['建設與影響','鐵路、港口、道路、水利等建設改善交通或生產，也服務殖民統治和資源運送。'],['生活變遷','教育、語言、飲食、服飾和城市生活出現變化；各族群、地區與不同時期經驗並不完全相同。'],['讀史方法','用時間線整理先後，找出「措施 → 影響 → 哪些人受影響」，避免只說好或壞。']],cards:[['日治時期大約何時？','1895年開始，1945年結束。'],['看到鐵路建設，還要問什麼？','建設用途、服務對象，以及對不同居民和經濟的影響。'],['歷史制度一定人人感受相同嗎？','不一定；要看族群、地區、身分與時間。']],questions:[['研究日本興建鐵路，哪個問題最能幫助理解歷史影響？',['只問鐵軌是什麼顏色','同時看建設目的、交通改變和不同居民受到的影響','假設所有人都得到相同好處','只背一個車站名字'],1,'歷史分析要連結目的和多元影響。'],['比較日治時期不同群體的生活，為什麼不能只寫一種經驗？',['每個人的生活與政策影響可能不同','歷史沒有日期','所有人住在同一座城市','生活與制度完全無關'],0,'比較不同群體能避免把複雜歷史說成單一故事。']]},

<script data-bundled-from="vocab.js">
(() => {
  const tones = ['', 'ˊ', 'ˇ', 'ˋ'];
  window.VOCAB_QUESTIONS = VOCAB_WORDS.flatMap(w => {
    const syllable = w.reading.replace(/[ˊˇˋ˙]/g,'');
    const sounds = [w.reading, ...tones.map(t => syllable+t).filter(p=>p!==w.reading)].slice(0,4);
    const marked = w.word.replace(w.char, `「${w.char}」`);
    const common = {lessonId:w.lessonId, vocabId:w.id, answer:0, origin:'課本生字延伸・本站另編', referenceUrl:w.sourceUrl, dictionaryUrl:w.dictionaryUrl};
    return [
      {...common, id:w.id+'-sound', skill:'生字注音', q:`${marked}中的「${w.char}」，正確的注音是哪一個？`, options:sounds, explain:`「${w.word}」的「${w.char}」讀 ${w.reading}。${w.meaning}${w.note?' '+w.note:''}`},
      {...common, id:w.id+'-char', skill:'生字國字', q:`「${w.word.replaceAll(w.char,'□')}」表示：${w.meaning.replaceAll(w.char,'□')} □ 的注音是 ${w.reading}，應填哪個國字？`, options:[w.char,...w.confusions], explain:`正確寫法是「${w.word}」，填「${w.char}」（${w.reading}）。${w.note||'請留意字的部件，再用手寫一次完整詞語。'}`}
    ];
  });
  for(const l of LESSONS) l.questions.push(...VOCAB_QUESTIONS.filter(q=>q.lessonId===l.id));
  QUESTION_BANK.push(...VOCAB_QUESTIONS);
  for(const ex of Object.values(EXAMS)) ex.questions = LESSONS.filter(l=>ex.subject==='混合'||l.subject===ex.subject).flatMap(l=>l.questions);
})();

function beginVocabExam(scope='lesson',id){
  if(id)vocabLesson=id;
  const kind=document.querySelector('#vocabKind');
  const count=document.querySelector('#vocabCount');
  if(kind)vocabKind=kind.value;
  if(count)vocabCount=count.value;
  const lessonId=scope==='all'?'all':vocabLesson;
  launchVocabExam(lessonId,vocabKind,vocabCount);
}
function launchVocabExam(lessonId,kind,count){
  const pool=VOCAB_QUESTIONS.filter(q=>(lessonId==='all'||q.lessonId===lessonId)&&(kind==='mix'||q.id.endsWith('-'+kind)));
  const title=lessonId==='all'?'六課生字混合':LESSONS.find(l=>l.id===lessonId)?.title+' · 生字';
  if(!pool.length)return notify('找不到這個生字範圍，請回生字本重新選擇。');
  startExam(`vocab:${lessonId}:${kind}:${count}`,DRILL.select(pool,count==='全部'?pool.length:Number(count),data.seen),'國語',title);
}
document.addEventListener('change',e=>{
  if(e.target.id==='vocabCover'){vocabCover=e.target.checked;renderVocab(vocabLesson);}
  if(e.target.id==='vocabKind')vocabKind=e.target.value;
  if(e.target.id==='vocabCount')vocabCount=e.target.value;
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-vocab-start]');if(b)beginVocabExam(b.dataset.vocabStart);});

</script>

<script data-bundled-from="english.js">

function renderEnglish(id){

  <section class="learning-route"><h2>今天用這 4 步學，不急著猜答案</h2><ol><li><strong>看圖說詞</strong><span>先看中文，猜英文，再翻卡；聽完跟讀。</span></li><li><strong>配一句話</strong><span>把單字放進 yesterday 或 last weekend 的句子。</span></li><li><strong>找兩個線索</strong><span>先找「何時」，再找 did / didn’t 或問句。</span></li><li><strong>說出錯因</strong><span>讀解析後，遮答案再說一次完整句。</span></li></ol></section>

  <section class="sentence-lab"><h2>🛠️ 句子變身工坊</h2><p>選一個活動，觀察同一件事如何變成肯定句、問句、否定句。先自己說，再核對下方句子。</p><label for="sentenceActivity">想練的活動</label><select id="sentenceActivity">${words.filter(w=>w.base).map(w=>`<option value="${w.id}">${w.zh} · ${w.base}</option>`).join('')}</select><div id="sentencePreview"></div></section>

function renderSentenceLab(){
  const select=document.querySelector('#sentenceActivity'),el=document.querySelector('#sentencePreview');if(!select||!el)return;
  const w=ENGLISH_WORDS.find(w=>w.id===select.value);if(!w)return;
  const tail=w.tail?' '+w.tail:'';
  el.innerHTML=`<div class="sentence-grid"><article><h3>✅ 說做過</h3><p lang="en">He <strong>${w.past}</strong>${tail} yesterday.</p><span>沒有 did，肯定句的動詞變成過去式。</span></article><article><h3>❓ 問做過嗎</h3><p lang="en"><strong>Did</strong> he <strong>${w.base}</strong>${tail} yesterday?</p><span>Did 已表示過去，後面回原形。</span></article><article><h3>🙅 說沒做</h3><p lang="en">He <strong>didn't ${w.base}</strong>${tail} yesterday.</p><span>didn’t 後也用原形。</span></article></div><button class="speak-button" data-sentence-say="${w.id}">🔊 聽三句，再試著跟讀</button>`;
}
function englishQuizPool(scope,skill){return ENGLISH_QUESTIONS.filter(q=>(scope==='all'||q.lessonId===scope)&&(skill==='全部'||q.skill===skill));}
function launchEnglishExam(scope,skill,count,mode){
  const pool=englishQuizPool(scope,skill);const title=(scope==='all'?'Unit 1–2':LESSONS.find(l=>l.id===scope)?.unit)+' · 英文期中';
  startExam(`english:${scope}:${skill}:${count}:${mode}`,DRILL.select(pool,count==='全部'?pool.length:Number(count),data.seen),'英文',title,mode);
}
function speakEnglish(text){
  if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){notify('這個瀏覽器不支援朗讀，可以看句子自行跟讀。');return;}
  window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.8;
  const voice=window.speechSynthesis.getVoices().find(v=>v.lang==='en-US')||window.speechSynthesis.getVoices().find(v=>v.lang.startsWith('en'));if(voice)u.voice=voice;
  u.onerror=()=>notify('朗讀暫時無法播放，請確認裝置語音功能。');window.speechSynthesis.speak(u);
}
document.addEventListener('change',e=>{if(e.target.id==='sentenceActivity')renderSentenceLab();});
document.addEventListener('click',e=>{
  const start=e.target.closest('[data-english-start]');if(start)launchEnglishExam(...['Scope','Skill','Count','Mode'].map(k=>document.querySelector('#english'+k).value));
  const word=e.target.closest('[data-english-say]');if(word){const w=ENGLISH_WORDS.find(w=>w.id===word.dataset.englishSay);if(w)speakEnglish(w.en);}
  const sound=e.target.closest('[data-phonics-say]');if(sound)speakEnglish(sound.dataset.phonicsSay);
  const sentence=e.target.closest('[data-sentence-say]');if(sentence){const w=ENGLISH_WORDS.find(w=>w.id===sentence.dataset.sentenceSay);if(w){const tail=w.tail?' '+w.tail:'';speakEnglish(`He ${w.en} yesterday. Did he ${w.base}${tail} yesterday? He didn't ${w.base}${tail} yesterday.`);}}
});

  const meaningQuestions = VOCAB_WORDS.flatMap((word, index) => {
    const sameLesson = VOCAB_WORDS.filter(w => w.lessonId === word.lessonId && w.meaning !== word.meaning && w.word !== word.word);
    const distractors = [], usedMeanings = new Set([word.meaning]), usedWords = new Set([word.word]);
    for (const candidate of sameLesson) {
      if (usedMeanings.has(candidate.meaning) || usedWords.has(candidate.word)) continue;
      distractors.push(candidate);
      usedMeanings.add(candidate.meaning);
      usedWords.add(candidate.word);
    }
    const start = index % distractors.length;
    const chosen = [0, 1, 2].map(offset => distractors[(start + offset) % distractors.length]);

    }, {
      id:`${word.id}-word`, lessonId:word.lessonId, vocabId:word.id, skill:'生字詞義',

      options:[word.word,...chosen.map(w => w.word)], answer:0,
      explain:`這段解釋對應「${word.word}」。再看一次「${word.char}」的字形與讀音 ${word.reading}。`,
      optionFeedback:Object.fromEntries(chosen.map(w => [w.word, `「${w.word}」是${w.meaning}題目的解釋對應「${word.word}」。`])),
      origin:'新增詞義回想・本站另編', batch, referenceUrl:word.sourceUrl, dictionaryUrl:word.dictionaryUrl
    }];
  });

  for (const [lessonId, questions] of Object.entries(rows)) {
    const lesson = LESSONS.find(l => l.id === lessonId);
    lesson.questions.push(...questions.map(([q, correct, wrong1, wrong2, wrong3, explain], i) => ({
      id:`extra-${lessonId}-${String(i + 1).padStart(2,'0')}`, lessonId, q,
      options:[correct,wrong1,wrong2,wrong3], answer:0, explain,
      origin:'新增期中練習・本站另編', batch
    })));
  }
  for (const q of meaningQuestions) LESSONS.find(l => l.id === q.lessonId).questions.push(q);
  QUESTION_BANK.push(...Object.keys(rows).flatMap(id => LESSONS.find(l => l.id === id).questions.filter(q => q.batch === batch)));
  for (const subject of ['國語','自然','社會']) {
    const exam = Object.values(EXAMS).find(ex => ex.subject === subject);
    exam.questions = LESSONS.filter(l => l.subject === subject).flatMap(l => l.questions);
  }
  EXAMS['mix-quiz'].questions = QUESTION_BANK.filter(q => !q.idiomId);
})();

<script data-bundled-from="practice.js">
// Pure selection helpers are also exercised by tests/check.mjs.
window.DRILL = {
  shuffle(items, random = Math.random) {
    const result = [...items];
    for (let i = result.length - 1; i > 0; i--) { const j = Math.floor(random() * (i + 1)); [result[i], result[j]] = [result[j], result[i]]; }
    return result;
  },
  options(q, random = Math.random) {
    if(q.type==='text')return {...q};
    const order = this.shuffle(q.options.map((_,i) => i), random);
    return {...q, options:order.map(i => q.options[i]), answer:order.indexOf(q.answer)};
  },
  select(pool, count, seen = {}, random = Math.random) {
    const unique = [...new Map(pool.map(q => [q.id || q.q, q])).values()];
    const unseen = unique.filter(q => !seen[q.id || q.q]);
    const old = unique.filter(q => seen[q.id || q.q]);
    return [...this.shuffle(unseen, random), ...this.shuffle(old, random)].slice(0, count);
  }
};

e"><option value="practice" ${lastDrill.mode==='practice'?'selected':''}>邊做邊學｜即時解析</option><option value="mock" ${lastDrill.mode==='mock'?'selected':''}>模擬考｜考後看解析</option></select></label></div><div class="drill-start"><p id="drillAvailability" role="status"></p><button class="button" type="submit">出發刷題 →</button></div></form><p class="fineprint">「新增題」指這次擴充的題庫，與已練習／未練習是兩回事。同回合不重複，選項順序每回合重排。以本次期中範圍複習。</p></section>`;

function drillPool(config) {

    const l = LESSONS.find(l=>l.id===q.lessonId), p=sourceFor(q);

}
function paperCard(p) {
  const count=QUESTION_BANK.filter(q=>q.sourceId===p.id).length;
  return `<article class="paper-card"><div class="paper-tags"><span class="subject-tag">${p.subject} · ${p.year} 學年度</span><span class="paper-kind">${esc(p.kind)} · ${esc(p.grade)}</span></div><h3>${esc(p.school)}</h3><p>${esc(p.scope)}</p>${p.examDate?`<p class="fineprint">校方標示 ${p.year} 學年度，卷面考試日期為 ${esc(p.examDate)}；學年度與舉辦日期不同。</p>`:''}<div class="source-list"><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${'開啟原卷'} ↗</a>${p.answerUrl?`<a href="${esc(p.answerUrl)}" target="_blank" rel="noopener noreferrer">${'原卷答案'} ↗</a>`:'<span class="fineprint">未取得填答後的解答</span>'}</div>${count?`<button class="paper-practice" data-paper-drill="${p.id}">練這份卷的延伸考點 · ${count} 題 →</button>`:'<p class="fineprint">外部閱讀，不計入站內刷題數。</p>'}</article>`;
}
function updateCatalog() {
  const el=document.querySelector('#paperResults'); if(!el)return;
  const subject=document.querySelector('#paperSubject').value, school=document.querySelector('#paperSchool').value, year=document.querySelector('#paperYear').value;
  const rows=PAPERS.filter(p=>(subject==='全部'||p.subject===subject)&&(school==='全部'||p.school===school)&&(year==='全部'||String(p.year)===year));
  document.querySelector('#paperCount').textContent=`找到 ${rows.length} 份段考／主題參考。數學、英文與成語目前提供站內另編練習，尚無已核對的校內段考原卷。`;
  el.innerHTML=rows.length?`<div class="paper-grid">${rows.map(paperCard).join('')}</div>`:'<p class="empty-state">沒有符合的試卷。可以回「筆記中心」讀重點、做站內練習，或調整篩選。</p>';
}
document.addEventListener('submit',e=>{if(e.target.id==='drillForm'){e.preventDefault();beginDrill();}});
document.addEventListener('change',e=>{
  if(e.target.closest('#drillForm')) {
    const form=document.querySelector('#drillForm');
    if(e.target.name==='subject') form.elements.lesson.value='全部';
    if(e.target.name==='lesson'&&e.target.value!=='全部') form.elements.subject.value=LESSONS.find(l=>l.id===e.target.value).subject;

document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-paper-drill]');
  if(btn) { const p=PAPERS.find(p=>p.id===btn.dataset.paperDrill);startExam(`paper:${p.id}`,DRILL.select(QUESTION_BANK.filter(q=>q.sourceId===p.id),20,data.seen),p.subject,`${p.school} · 考點延伸`); }
  const anchor=e.target.closest('a[href^="#"]');
  if(anchor && anchor.getAttribute('href')===location.hash && session?.examId){e.preventDefault();route();}
});

</script>
<script data-bundled-from="text-answer.js">
// Keep the live input mounted while a Chinese IME is composing a character.
let textComposing=false;
function cleanTextAnswer(value){return String(value??'').normalize('NFC').replace(/\s/g,'')}
function validDraft(q,value){return q.type==='text'?typeof value==='string'&&Array.from(value).length===q.blankSize&&/^\p{Script=Han}+$/u.test(value):Number.isInteger(value)&&value>=0&&value<q.options.length}
function textAnswerHtml(q,value,reveal){
  return `<div class="text-answer"><p class="idiom-meaning-clue">💡 意思線索：${esc(IDIOMS.find(w=>w.id===q.idiomId).meaning)}</p><label for="writtenAnswer">依空格順序填入 ${q.blankSize} 個國字</label><input id="writtenAnswer" type="text" value="${esc(value??'')}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="writtenHelp" ${reveal?'disabled':''}><p id="writtenHelp">只填缺少的 ${q.blankSize} 字，不用寫整個成語。可用注音或平板鍵盤的中文手寫輸入。</p></div>`;
}
function confirmationMessage(s,q,r,pending){
  if(q.type==='text'){
    if(textComposing)return '正在輸入中文字，選好字後再確認。';
    if(!validDraft(q,s.selected))return `請依序輸入 ${q.blankSize} 個國字，再按確認。`;
    if(pending)return `已填「${s.selected}」，尚未確認。請檢查字形再按確認。`;
  }
  return pending?`已選 ${String.fromCharCode(65+s.selected)}，尚未確認。可以重新選擇，想好再按確認。`:r?'答案已記錄，可修改；修改後請再確認，交卷後一起對答案。':'先點選一個答案，想好再按確認。';
}
function confirmationHtml(s,q,r,pending){return `<div class="answer-confirm"><p role="status">${esc(confirmationMessage(s,q,r,pending))}</p><button class="button confirm-answer" data-action="confirm-answer" ${pending&&validDraft(q,s.selected)&&!textComposing?'':'disabled'}>${r?(pending?'確認修改':'已確認答案'):'確認答案'}</button></div>`}
function syncTextDraft(value){
  const s=session,q=s?.items?.[s.index];if(!q||q.type!=='text'||s.finished||(s.mode!=='mock'&&s.responses[s.index]))return;
  const normalized=cleanTextAnswer(value);s.drafts[s.index]=normalized||null;s.selected=s.drafts[s.index];
  const r=s.responses[s.index],pending=s.selected!==null&&(!r||r.selected!==s.selected);
  const box=document.querySelector('.answer-confirm');if(box)box.outerHTML=confirmationHtml(s,q,r,pending);
  // Update the collapsed map without rerendering the focused input.
  const done=s.responses.filter((r,i)=>r&&s.drafts[i]===r.selected).length;
  const summary=document.querySelector('.question-map summary');if(summary)summary.textContent=`🗺️ 題號地圖 · 已答 ${done} / ${s.items.length}（可跳題）`;
  const mapButton=document.querySelector(`[data-question-index="${s.index}"]`);
  if(mapButton){const confirmed=!!r&&r.selected===s.selected;mapButton.classList.toggle('is-answered',confirmed);mapButton.textContent=`${confirmed?'●':s.selected!==null?'◐':'○'} ${s.index+1}`;mapButton.setAttribute('aria-label',`第 ${s.index+1} 題，${confirmed?'已確認':s.selected!==null?'待確認':'未選'}`)}
  const bar=document.querySelector('.exam-progress');if(bar){bar.setAttribute('aria-valuenow',done);bar.querySelector('i').style.width=pct(done/s.items.length)+'%'}
}
document.addEventListener('compositionstart',e=>{if(e.target.id==='writtenAnswer'){textComposing=true;syncTextDraft(e.target.value)}});
document.addEventListener('compositionend',e=>{if(e.target.id==='writtenAnswer'){textComposing=false;syncTextDraft(e.target.value)}});
document.addEventListener('input',e=>{if(e.target.id==='writtenAnswer'&&!e.isComposing)syncTextDraft(e.target.value)});

</script>
<script data-bundled-from="quiz.js">
// Response slots belong to question positions. Navigation never reshuffles or scores twice.
function startExam(id,items,subject,title,mode='practice'){
  if(!items?.length){notify('目前沒有可練習的題目。');return renderHome();}
  textComposing=false;
  const shuffled=DRILL.shuffle(items.map(normalizeQuestion)).map(q=>DRILL.options(q));
  session={examId:id,items:shuffled,index:0,answered:false,selected:null,correct:0,combo:0,bestCombo:0,xpEarned:0,levelBefore:Math.floor((data.xp||0)/100)+1,subject,title,mode,responses:Array(shuffled.length).fill(null),drafts:Array(shuffled.length).fill(null),finished:false};
  renderQuestion();window.scrollTo(0,0);
}
function goQuestion(index,incomplete=false){
  if(!session?.items||session.finished||!Number.isInteger(index)||index<0||index>=session.items.length)return;
  textComposing=false;session.index=index;session.incomplete=incomplete;renderQuestion();window.scrollTo(0,0);
}
function learningFeedback(q,selected){
  const right=q.type==='text'?selected===q.expected:selected===q.answer,choice=q.type==='text'?selected:q.options[selected],correct=q.options[q.answer];
  let reason=q.optionFeedback?.[choice],clue=q.clue,rule=q.rule,tryIt=q.tryIt;
  if(q.type==='text'){const w=IDIOMS.find(w=>w.id===q.idiomId);const comparison=Array.from(q.expected).map((c,i)=>choice?.[i]===c?`第 ${i+1} 格「${c}」正確`:`第 ${i+1} 格你填「${choice?.[i]||'空白'}」，應是「${c}」`).join('；');reason=`${comparison}。完整寫法是「${w.idiom}」。${w.tip} 意思：${w.meaning}`;}
  if(q.vocabId){const w=VOCAB_WORDS.find(w=>w.id===q.vocabId);if(w){clue=`指定詞語「${w.word}」`;
    if(q.skill==='生字詞義'){
      reason=right?q.explain:reason||`「${w.word}」的意思是${w.meaning}`;
      rule=`「${w.word}」表示${w.meaning}留意「${w.char}」在這個詞語中的用法。`;
      tryIt=`遮住選項，自己說出「${w.word}」的意思，再造一個句子。`;
    }else{
      rule=`${w.char}：${w.reading}。${w.note||'把字、讀音和詞語連起來記。'}`;
      tryIt=`遮住答案，先念「${w.word}」，再在紙上寫一次。`;
      reason=right?`你把詞語、字形與讀音配對了。`:q.skill==='生字注音'?`你選的「${choice}」與這裡「${w.word}」的讀音 ${w.reading} 不同；請比較聲調，並留意多音字要看詞語。`:`題目要完成「${w.word}」，所以應寫「${w.char}」；你選的「${choice}」是另一個字。請對照部件，再自己寫出完整詞語。`;
    }
  }}
  const subject=LESSONS.find(l=>l.id===q.lessonId)?.subject;
  if(!tryIt)tryIt=subject==='自然'?'用自己的話說出實驗條件或現象的原因，再想一個可以驗證的例子。':subject==='社會'?'用「事件／制度 → 原因 → 影響」說明答案，不只背選項。':'遮住選項，指出題目中的行動或描述，說明它怎麼支持答案。';
  return `<div class="explain ${right?'good':'try'}"><h2>${right?'🌟 答對，也說說理由':'🔎 找到可以修正的一步'}</h2><p><strong>你的答案：</strong>${esc(choice)}</p><p><strong>正確答案：</strong>${esc(correct)}</p><div class="feedback-steps">${clue?`<p><strong>① 找線索</strong><br>${esc(clue)}</p>`:''}<p><strong>${clue?'②':'①'} ${right?'為什麼正確':'這個選項為何不合'}</strong><br>${esc(reason||`${right?'這個答案符合題目線索。':'把你選的答案與下列判斷依據對照：'} ${q.explain}`)}</p><p><strong>${clue?'③':'②'} 記住判斷方法</strong><br>${esc(rule||q.explain)}</p></div><details class="explain-back"><summary>🗣️ 換你試試：遮住答案說一次</summary><p>${esc(tryIt)}</p><p>自我檢查：我有說出線索嗎？我能解釋另一個選項為何不合嗎？這是口頭練習，不自動評分。</p></details></div>`;
}
function trainingRank(level){return level>=10?'知識大師':level>=7?'學習探險家':level>=4?'解題高手':'練功新手'}
function trainingHud(s,done){
  const xp=data.xp||0,level=Math.floor(xp/100)+1,within=xp%100,goal=Math.min(5,s.items.length),cleared=Math.min(goal,done),milestones=[...new Set([1,3,goal])];
  return `<section class="training-hud" aria-label="本回合練功進度"><div class="training-top"><div class="training-rank"><span class="training-avatar" aria-hidden="true">🧭</span><div><strong>Lv.${level} ${trainingRank(level)}</strong><small>累積 ${xp} XP${s.mode==='mock'?' · 交卷後結算':''}</small></div></div><div class="training-stats"><span>⚡ 本回合 +${s.xpEarned} XP</span><span>🔥 連對 ${s.combo} 題</span></div></div><div class="level-track" role="progressbar" aria-label="升級經驗值" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${within}"><i style="width:${within}%"></i></div><div class="training-bottom"><span>下一級還差 ${100-within} XP</span><span>小目標 ${cleared}/${goal} 題</span></div><div class="quest-steps" aria-label="本回合小目標">${milestones.map(n=>`<span class="quest-step ${cleared>=n?'cleared':''}">${cleared>=n?'✓':'○'} ${n===goal?'完成這回合':`答完 ${n} 題`}</span>`).join('')}</div>${s.combo>=2?`<p class="combo-note" role="status">✨ 連對 ${s.combo} 題！再接再厲，連對 3 題有額外 XP。</p>`:''}</section>`
}
function renderQuestion(){
  const s=session,q=s.items[s.index],length=s.items.length,r=s.responses[s.index];s.answered=!!r;s.selected=s.drafts[s.index]??r?.selected??null;
  const reveal=!!r&&s.mode!=='mock',done=s.responses.filter((r,i)=>r&&s.drafts[i]===r.selected).length,pending=s.selected!==null&&(!r||s.selected!==r.selected);
  main.innerHTML=`<section class="exam-shell"><div class="exam-shell-top"><button class="back-button" data-action="exit-exam">← 離開本回合</button><span class="mini-tag">${esc(s.title)}</span></div>${trainingHud(s,done)}<div class="exam-progress" role="progressbar" aria-label="答題進度" aria-valuemin="0" aria-valuemax="${length}" aria-valuenow="${done}"><i style="width:${pct(done/length)}%"></i></div><details class="question-map"><summary>🗺️ 題號地圖 · 已答 ${done} / ${length}（可跳題）</summary><p>● 已確認；◐ 待確認；○ 未選。點題號回看，選項會保留。</p><div class="question-numbers">${s.items.map((_,i)=>{const confirmed=s.responses[i]&&s.drafts[i]===s.responses[i].selected,picked=s.drafts[i]!==null;return `<button data-question-index="${i}" class="${confirmed?'is-answered':''}" ${i===s.index?'aria-current="step"':''} aria-label="第 ${i+1} 題，${confirmed?'已確認':picked?'待確認':'未選'}">${confirmed?'●':picked?'◐':'○'} ${i+1}</button>`;}).join('')}</div></details><div class="question-box"><div class="question-meta">第 ${s.index+1} 題 / ${length} 題 · ${esc(LESSONS.find(l=>l.id===q.lessonId)?.title||s.subject)}</div><p class="fineprint">${s.mode==='mock'?'模擬考：先作答，再按「確認答案」。修改後也要確認，交卷後才看解析。':'練習模式：先作答，再按「確認答案」看解析。確認前可修改；確認後可往前回看。'}</p>${s.incomplete?'<p class="incomplete-note" role="status">還有題目沒作答或尚未確認，已帶你到需要確認的題目；請按「確認答案」後再交卷。</p>':''}<h1 class="question-text">${esc(q.q)}</h1>${q.type==='text'?textAnswerHtml(q,s.selected,reveal):`<div class="option-list">${q.options.map((o,i)=>{let cls='';if(reveal&&i===q.answer)cls='correct';else if(reveal&&i===s.selected)cls='wrong';else if(i===s.selected)cls='selected';return `<button class="option ${cls}" data-answer="${i}" aria-pressed="${i===s.selected}" ${reveal?'disabled':''}><span class="option-letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`;}).join('')}</div>`}${reveal?`${learningFeedback(q,s.selected)}${questionSourceHtml(q)}`:confirmationHtml(s,q,r,pending)}<div class="question-controls"><button class="button button-small" data-action="prev-question" ${s.index===0?'disabled':''}>← 上一題</button><span class="question-meta">${s.mode==='mock'?'已答 '+done+' 題':'答對 '+s.correct+' 題'}</span><button class="button" data-action="${s.index===length-1?'finish-exam':'next-question'}">${s.index===length-1?'交卷看結果':'下一題 →'}</button></div></div></section>`;
}
function recordResponse(r){
  if(r.recorded)return;r.recorded=true;const q=r.q,s=session,earned=r.correct?10:5;data.xp=(data.xp||0)+earned;if(s){s.xpEarned+=earned;if(r.correct){s.combo++;s.bestCombo=Math.max(s.bestCombo,s.combo);if(s.combo%3===0){data.xp+=5;s.xpEarned+=5;}}else s.combo=0;}
  if(q.idiomId){data.idiomProgress ||= {};const p=data.idiomProgress[q.idiomId] ||= {};p[q.type==='text'?'blank':'meaning']=r.correct;}
  data.seen[q.id]=true;data.totalAnswered++;
  const day=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),today=day(new Date());
  if(data.lastDay!==today){const prev=new Date();prev.setDate(prev.getDate()-1);data.streak=data.lastDay===day(prev)?data.streak+1:1;data.lastDay=today;}
  const id=q.lessonId||findLessonForQuestion(q),st=data.stats[id]||(data.stats[id]={seen:0,correct:0});st.seen++;
  if(r.correct){data.totalCorrect++;st.correct++;removeWrong(q);if(!q.idiomId)data.done[id]=true;}
  else {const list=data.wrong[id]||(data.wrong[id]=[]),saved={...q,selectedAnswer:q.type==='text'?r.selected:q.options[r.selected]};const i=list.findIndex(x=>x.id===q.id||x.q===q.q);if(i<0)list.push(saved);else list[i]=saved;}
  if(q.idiomId){if(IDIOMS.every(w=>idiomStars(w)===2))data.done[id]=true;else delete data.done[id];}
}
function answer(i){
  const s=session;if(!s?.items||s.finished||(s.mode!=='mock'&&s.responses[s.index]))return;
  const q=s.items[s.index];if(q.type==='text')return;if(!Number.isInteger(i)||i<0||i>=q.options.length)return;
  s.drafts[s.index]=i;renderQuestion();
  document.querySelector('[data-answer="'+i+'"]')?.focus();
}
function confirmAnswer(){
  const s=session;if(!s?.items||s.finished||(s.mode!=='mock'&&s.responses[s.index]))return;
  const q=s.items[s.index],i=s.drafts[s.index];
  if(!validDraft(q,i)||textComposing||s.responses[s.index]?.selected===i)return;
  const r={q,selected:i,correct:q.type==='text'?i===q.expected:i===q.answer};s.responses[s.index]=r;s.correct=s.responses.filter(x=>x?.correct).length;s.incomplete=false;
  if(s.mode!=='mock'){recordResponse(r);saveData();updateTop();}renderQuestion();
}
function finishExam(){
  if(!session?.items)return;
  const s=session,missing=s.responses.findIndex((r,i)=>!r||s.drafts[i]!==r.selected);
  if(missing>=0){goQuestion(missing,true);return;}
  if(!s.finished){s.responses.forEach(recordResponse);s.finished=true;saveData();}
  renderResult();
}
function reviewHtml(s){return `<section class="attempt-review"><h2>這回合的答案與解析</h2><p>找到線索 → 比較選項 → 用自己的話說一次。先複習「待複習」的題目。</p>${s.responses.filter(Boolean).map((r,i)=>`<article class="review-item ${r.correct?'is-correct':'is-wrong'}"><div class="question-meta">第 ${i+1} 題 · ${r.correct?'✓ 答對':'待複習'}</div><h3>${esc(r.q.q)}</h3>${learningFeedback(r.q,r.selected)}${questionSourceHtml(r.q)}</article>`).join('')}</section>`;}

function idiomRoundPool(zone,kind){
  const words=idiomWords(zone),pool=[];
  for(const w of words){
    if(kind!=='meaning')pool.push(...DRILL.select(IDIOM_QUESTIONS.filter(q=>q.idiomId===w.id&&q.type==='text'),1,data.seen));
    if(kind!=='blank')pool.push(IDIOM_QUESTIONS.find(q=>q.idiomId===w.id&&q.skill==='成語意思'));

}
function launchIdiomExam(zone='1',kind='mix',count='16',mode='practice'){
  zone=zone==='all'||/^[1-8]$/.test(zone)?zone:'1';
  kind=['blank','meaning','mix','wrong'].includes(kind)?kind:'mix';mode=mode==='mock'?'mock':'practice';
  const words=idiomWords(zone),pool=kind==='wrong'?Object.values(data.wrong).flat().filter(q=>words.some(w=>w.id===q.idiomId)):idiomRoundPool(zone,kind);

}

<script data-bundled-from="notebook.js">

  成語天地:['填字','意思','字形','記憶線索']
};
const noteReviewKey='notebook';
function noteText(value,note){
  const terms=[note.title,...NOTE_TERMS[note.subject]].filter(Boolean).sort((a,b)=>b.length-a.length);
  const expression=new RegExp('('+terms.map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\</body>')).join('|')+')','g');
  return String(value).split(expression).map(part=>terms.includes(part)?`<mark class="note-mark${part==='紅色'?' note-mark-red':part==='藍色'?' note-mark-blue':''}">${esc(part)}</mark>`:esc(part)).join('');
}
function noteRecord(id){return data[noteReviewKey]?.[id]||null}
function localStudyDate(day){return [day.getFullYear(),String(day.getMonth()+1).padStart(2,'0'),String(day.getDate()).padStart(2,'0')].join('-')}
function noteDue(id){const r=noteRecord(id);return !r||!r.next||r.next<=localStudyDate(new Date())}
function noteSummary(){const read=STUDY_NOTES.filter(n=>noteRecord(n.id)),due=read.filter(n=>noteDue(n.id));return {read:read.length,due:due.length,total:STUDY_NOTES.length}}
function noteSubjectHtml(subject){const notes=STUDY_NOTES.filter(n=>n.subject===subject),read=notes.filter(n=>noteRecord(n.id)).length;return `<a href="#notes/${encodeURIComponent(subject)}" class="note-subject ${subject===activeNoteSubject?'active':''}" ${subject===activeNoteSubject?'aria-current="page"':''} style="--note-accent:${NOTE_COLORS[subject]}"><strong>${esc(subject)}</strong><span>${read} / ${notes.length} 已看</span></a>`}
let activeNoteSubject='國語';
function vocabNoteOrigin(){
  const origin=history.state?.vocabReturn;
  return STUDY_NOTES.some(n=>n.id===origin?.noteId&&n.subject==='國語')&&Number.isFinite(origin.scrollY)?origin:null;
}
function renderNotebook(target,preservePosition=false){

  main.innerHTML=`<section class="notebook" style="--note-accent:${NOTE_COLORS[activeNoteSubject]}"><div class="note-head"><div><div class="detail-kicker">115 學年度 · 六上期中</div><h1>筆記中心</h1><p>國語、英文、數學、自然、社會與成語天地；沿著本次考試範圍讀重點、練回想、訂正失分處。</p></div><div class="note-overview"><strong>${summary.read} / ${summary.total}</strong><span>已看筆記</span><small>${summary.due} 篇待回想</small></div></div>
  <div class="note-method" aria-label="筆記閱讀順序"><span><b>①</b> 讀重點</span><span><b>②</b> 遮答案自己說</span><span><b>③</b> 做題後訂正</span></div>

  <div class="note-stepper"><a href="#notes/${list[Math.max(0,index-1)].id}" ${index===0?'aria-disabled="true" tabindex="-1"':''}>← 上一篇</a><a href="#notes/${list[Math.min(list.length-1,index+1)].id}" ${index===list.length-1?'aria-disabled="true" tabindex="-1"':''}>下一篇 →</a></div></article></div>

  updateTop();
  const returning=history.state?.notebookReturn;
  if(previousScroll!==null)window.scrollTo({top:previousScroll,behavior:'instant'});
  else if(returning?.noteId===note.id&&Number.isFinite(returning.scrollY))requestAnimationFrame(()=>window.scrollTo({top:returning.scrollY,behavior:'instant'}));

function markNote(id,status){
  if(!STUDY_NOTES.some(n=>n.id===id)||!['again','know'].includes(status))return;

}
document.addEventListener('click',e=>{
  const button=e.target.closest('[data-note-review]');if(button)markNote(button.dataset.noteId,button.dataset.noteReview);
  if(e.defaultPrevented||e.button>0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;

  if(entry){
    e.preventDefault();

  }
  const origin=vocabNoteOrigin();

    return;
  }
  if(e.target.closest('[data-vocab-return]')){
    e.preventDefault();
    history.pushState({notebookReturn:origin},'',`#notes/${origin.noteId}`);
    route();
  }
});

function paperItems(p){return p.groups.flatMap(g=>g.items)}
function paperState(p){data.afterPapers ||= {};return data.afterPapers[p.id] ||= {choices:{},submitted:false,first:null}}
function paperScore(p,s){return paperItems(p).filter((q,i)=>s.choices[i]===q[2]).length}
function paperMenu(){return `<section class="check-ritual"><h2>獨立驗收卷</h2><div class="paper-menu">${AFTER_PAPERS.map(p=>{
  const s=paperState(p),n=paperItems(p).length;
  return `<a href="#after-exam/${p.id}"><strong>${esc(p.title)}</strong><small>${s.first!=null?`首次 ${s.first} / ${n} 題答對`:Object.keys(s.choices).length?`繼續作答 · 已選 ${Object.keys(s.choices).length} / ${n} 題`:`${n} 題 · 尚未作答`} →</small></a>`;
}).join('')}</div></section>`}
function renderAfterPaper(id){
  const p=AFTER_PAPERS.find(x=>x.id===id);if(!p)return renderAfterExam();session=null;
  const s=paperState(p),n=paperItems(p).length;let i=0;
  main.innerHTML=`<section class="after-exam-page exam-paper"><a href="#after-exam">← 回考後升級基地</a><h1>${esc(p.title)}</h1><p>${s.submitted?`首次 ${s.first} / ${n} 題答對；本次 ${paperScore(p,s)} / ${n} 題答對。先找答錯的那一題，指給自己看：材料裡哪一句能改變我的答案？`:'先讀材料再作答。交卷前可以改選，整卷交出才揭曉答案。'}</p>${p.groups.map(g=>`<section class="paper-group"><h2>${esc(g.title)}</h2><p>${esc(g.text)}</p>${g.table?`<table aria-label="${esc(g.title)}"><thead><tr>${g.table[0].map(c=>`<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>${g.table.slice(1).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:''}${g.items.map(([stem,opts,key,why])=>{
    const j=i++,v=s.choices[j];return `<fieldset><legend>${j+1}. ${esc(stem)}</legend>${opts.map((opt,k)=>`<label><input type="radio" name="paper-${j}" data-paper-pick="${p.id}" data-item="${j}" value="${k}" ${v===k?'checked':''} ${s.submitted?'disabled':''}> ${esc(opt)}</label>`).join('')}${s.submitted?`<p class="station-feedback ${v===key?'is-correct':'is-retry'}"><strong>${v===key?'答對了':'再找一次線索'} · 正解：${esc(opts[key])}</strong><br>${esc(why)}</p>`:''}</fieldset>`}).join('')}</section>`).join('')}<p id="paper-count" aria-live="polite">已選 ${Object.keys(s.choices).length} / ${n} 題</p><button class="button" data-paper-action="${p.id}">${s.submitted?'重做同一卷（保留首次成績）':'確認交卷，看解析'}</button>　<a href="#after-exam">回基地</a></section>`;
}
document.addEventListener('change',e=>{
  const el=e.target,p=AFTER_PAPERS.find(x=>x.id===el.dataset?.paperPick);if(!p)return;
  const s=paperState(p),i=Number(el.dataset.item),k=Number(el.value),items=paperItems(p);
  if(s.submitted||!items[i]||!Number.isInteger(k)||k<0||k>=items[i][1].length)return;
  s.choices[i]=k;saveData();document.querySelector('#paper-count').textContent=`已選 ${Object.keys(s.choices).length} / ${items.length} 題`;
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-paper-action]');if(!el)return;
  const p=AFTER_PAPERS.find(x=>x.id===el.dataset.paperAction);if(!p)return;const s=paperState(p);
  if(s.submitted){s.submitted=false;s.choices={}}else{
    const missing=paperItems(p).findIndex((q,i)=>!Number.isInteger(s.choices[i]));
    if(missing!==-1){notify(`第 ${missing+1} 題還沒選。`);document.querySelector(`[name="paper-${missing}"]`)?.focus();return}
    s.first ??= paperScore(p,s);s.submitted=true;
  }
  saveData();renderAfterPaper(p.id);window.scrollTo(0,0);
});

function afterExamProgress(station){
  data.afterExam ||= {};
  return data.afterExam[station.id] ||= {index:0,streak:0,cleared:false,answered:false};
}
function afterExamScore(){
  const states=AFTER_EXAM_STATIONS.map(afterExamProgress);
  return {cleared:states.filter(s=>s.cleared).length,total:states.length};
}
function renderAfterExam(){
  session=null;
  const score=afterExamScore();
  main.innerHTML=`<section class="after-exam-page"><header class="after-exam-hero"><div class="eyebrow">POST-TEST POWER-UP</div><h1>考後升級基地</h1><p>暖身 ${score.total} 關共 ${AFTER_EXAM_STATIONS.reduce((n,s)=>n+s.questions.length,0)} 題；獨立驗收 ${AFTER_PAPERS.length} 卷共 ${AFTER_PAPERS.reduce((n,p)=>n+paperItems(p).length,0)} 題。徽章記錄暖身進度，驗收另看首次成績。</p><div class="after-exam-score"><strong>${score.cleared}<small> / ${score.total}</small></strong><span>已點亮徽章</span><i><b style="width:${pct(score.cleared/score.total)}%"></b></i></div></header>
  ${paperMenu()}<section class="check-ritual" aria-label="考卷檢查三步驟"><div class="ritual-title"><span>🧠 考場超能力</span><strong>檢查不是重看，是找證據</strong></div><div class="ritual-steps"><article><b>1</b><strong>圈任務</strong><p>圈出「不正確、最主要、全部」等關鍵字。</p></article><article><b>2</b><strong>找線索</strong><p>回文章、圖表或實驗，找到能支持答案的那一格。</p></article><article><b>3</b><strong>逐項驗</strong><p>說出答案為何符合，並找出其他選項錯在哪裡。</p></article></div><p class="ritual-memory">口訣：<strong>圈題目 → 找證據 → 驗選項</strong>。檢查幾遍不是重點，每遍都做對一件事才有用。</p></section>
  <div class="after-exam-grid">${AFTER_EXAM_STATIONS.map((station,index)=>afterExamStationHtml(station,index)).join('')}</div><p class="after-exam-foot">每次作答都會自動儲存在這台裝置。答錯是線索，不會扣分；下次打開可以繼續闖關。</p></section>`;
}
function afterExamStationHtml(station,index){
  const p=afterExamProgress(station),q=station.questions[p.index%station.questions.length];
  const answered=p.answered;
  // Stored choices always use their original IDs. Only their display positions change.
  const offset=[[2,0,3],[1,3,0],[3,1,2],[0,2,1],[2,1,3],[1,0,2]][index][p.index%3];
  const order=q.options.map((_,k)=>(k+offset)%q.options.length);
  const title=`${String(index+1).padStart(2,'0')} / ${station.subject}`;
  return `<article class="power-station ${p.cleared?'is-cleared':''}" style="--station:${station.color}"><div class="station-top"><span class="station-icon" aria-hidden="true">${station.icon}</span><div><span class="station-kicker">${title}</span><h2>${station.title}</h2><p>${station.subtitle}</p></div><span class="station-medal" aria-label="${p.cleared?'已通關':`連對 ${p.streak} / 2`}">${p.cleared?'✦ 徽章':`${p.streak} / 2`}</span></div><details class="station-note"><summary>打開記憶口訣</summary><p>${station.hook}</p><strong>${station.say}</strong></details><div class="station-quiz"><div class="station-quiz-meta">第 ${(p.index%station.questions.length)+1} 個問法 · ${p.cleared?'自由複習':'連續答對兩題點亮徽章'}</div><h3>${q.q}</h3><div class="station-options">${order.map((i,k)=>{const option=q.options[i];const cls=answered?(i===q.answer?'is-answer':i===p.selected?'is-choice-wrong':''):p.draft===i?'is-picked':'';return `<button class="station-option ${cls}" aria-pressed="${(answered?p.selected:p.draft)===i}" data-after-pick="${station.id}" data-option="${i}" ${answered?'disabled':''}><span>${String.fromCharCode(65+k)}</span>${option}</button>`}).join('')}</div>${!answered?`<button class="button button-small" data-after-answer="${station.id}" ${Number.isInteger(p.draft)?'':'disabled'}>確認答案</button>`:''}${answered?`<div class="station-feedback ${p.lastCorrect?'is-correct':'is-retry'}" role="status"><strong>${p.lastCorrect?(p.cleared?'暖身答對了！可以試一份獨立驗收卷。':'✨ 找對線索了！再連對一題就點亮徽章。'):'🧩 看看這個選項卡在哪裡，再挑下一種問法。'}</strong><p>${q.why[p.selected]}</p>${!p.lastCorrect?`<p><b>記憶口訣：</b>${station.say}</p>`:''}</div><div class="station-actions"><button class="button button-small" data-after-next="${station.id}">${p.cleared?'再練下一題':'繼續下一個問法 →'}</button>${p.cleared?`<button class="station-reset" data-after-reset="${station.id}">重練這一關</button>`:''}</div>`:''}</div></article>`;
}
document.addEventListener('click',event=>{
  const pick=event.target.closest('[data-after-pick]');
  if(pick){const station=AFTER_EXAM_STATIONS.find(x=>x.id===pick.dataset.afterPick),p=afterExamProgress(station),i=Number(pick.dataset.option);if(!p.answered&&Number.isInteger(i)&&i>=0&&i<4){p.draft=i;saveData();renderAfterExam();main.querySelector?.(`[data-after-pick="${station.id}"][data-option="${i}"]`)?.focus({preventScroll:true})}return}
  const answer=event.target.closest('[data-after-answer]');
  if(answer){
    const station=AFTER_EXAM_STATIONS.find(x=>x.id===answer.dataset.afterAnswer),p=afterExamProgress(station),q=station.questions[p.index%station.questions.length],selected=p.draft;
    if(p.answered||!Number.isInteger(selected)||selected<0||selected>=q.options.length)return;
    delete p.draft;p.lastCorrect=selected===q.answer;p.selected=selected;p.answered=true;p.streak=p.lastCorrect?p.streak+1:0;p.cleared=p.cleared||p.streak>=2;saveData();renderAfterExam();return;
  }
  const next=event.target.closest('[data-after-next]');
  if(next){const station=AFTER_EXAM_STATIONS.find(x=>x.id===next.dataset.afterNext),p=afterExamProgress(station);if(!p.answered)return;p.index=(p.index+1)%station.questions.length;p.answered=false;p.selected=null;delete p.lastCorrect;saveData();renderAfterExam();return;}
  const reset=event.target.closest('[data-after-reset]');
  if(reset){const station=AFTER_EXAM_STATIONS.find(x=>x.id===reset.dataset.afterReset);data.afterExam[station.id]={index:0,streak:0,cleared:false,answered:false};saveData();renderAfterExam();}
});

 {id:'chi',name:'國語',scope:'南一六上第 7–10 課',title:'把文章讀成線索圖',color:'#30755a',teach:[['讀事件','把每課整理成「人物／情境 → 遇到的事 → 做的選擇 → 結果」。每個箭頭都要在課文找到句子。'],['抓段落任務','先用一句話說每段在做什麼，再看段落間是因果、轉折、舉例或先後。連接詞常是答題路標。'],['詞語不孤立背','先看前後句猜詞義，再用同課另一句檢查。生字字音、字形及詞語以第 7–10 課課本為準。'],['期中弱點怎麼補','期中社會卷曾出現把局部資料擴大成「全部」的風險；國語回答也要守住文章證據和範圍，不替作者多說。']],qs:[['題目問人物為何做這個決定，最可靠的答法是？',['只寫「因為他很勇敢」','用課文中事件和描寫支持原因','猜作者沒有寫出的心情','抄一個不相關的生字'],1,'人物動機要用文中行動、對話或結果支持，不能只貼性格標籤。'],['段落出現「然而」，閱讀時先留意什麼？',['後面可能轉折，和前文比較','後面一定是人物名字','這表示故事已結束','可以跳過後半段'],0,'「然而」提示前後意思可能不同，常是理解轉折的重要線索。'],['課文寫「他反覆試了幾次，終於成功」。哪個推論最貼近句子？',['他一次就成功','他經過多次嘗試後成功','他從未遇到困難','所有人都會用同一方法成功'],1,'「反覆幾次」和「終於」支持多次嘗試後成功，不能推成人人都如此。'],['要記一課生字並避免只會認、不會用，哪種練習最好？',['抄字不看詞語','讀音、字形、詞語和課文句子一起練','只背頁碼','看答案後立刻說已經會了'],1,'把字放進詞和句子，能同時檢查讀音、字形與語境。'],['問「哪個說法不符合本文」，第一步做什麼？',['圈出「不符合」，逐項回文核對','挑最熟悉的選項','找到一項符合就停','用課外常識取代課文'],0,'先鎖定題目要找「不符合」，再逐項找文中證據。']]},
 {id:'math',name:'數學',scope:'康軒六上第 5–6 單元',title:'比與比值 × 圓周長',color:'#176b89',teach:[['比先排順序','甲：乙＝3：5，前項是甲、後項是乙。題目把順序換掉，答案就不同；先在數字上標註代表誰。'],['比值與等值比','3：5 的比值為 3÷5＝3/5。等值比要前項、後項同乘或同除相同非零數。'],['用比解題','先把兩個量依題意排成同順序，確認單位相同，再列等值比或比值；算完帶回題目驗證。'],['圓周率','π＝圓周長÷直徑；圓周長＝直徑×π＝半徑×2×π。若已給直徑，不可多乘一次 2。'],['單位與估算','圓周長是長度，答案用公分或公尺。先估「約為直徑 3 倍多」；扇形弧長是整個圓周的一部分。']],qs:[['紅球：藍球＝3：5，比值是多少？',['5/3','3/5','3/8','5/8'],1,'比值是前項除以後項，紅：藍＝3÷5。'],['甲：乙＝4：7，兩項同乘 3 的等值比？',['12：21','4：21','7：12','12：7'],0,'等值比的兩項要同乘相同數：4×3：7×3。'],['圓直徑 12 公分，π 取 3.14，周長是多少？',['18.84 公分','37.68 公分','75.36 平方公分','37.68 平方公分'],1,'C＝πd＝3.14×12＝37.68；周長用公分，不是平方公分。'],['圓周長 31.4 公分，π 取 3.14，直徑是多少？',['5 公分','10 公分','15.7 公分','100 公分'],1,'d＝C÷π＝31.4÷3.14＝10 公分。'],['圓半徑 5 公尺，π 取 3.14，周長？',['15.7 公尺','31.4 公尺','78.5 平方公尺','31.4 平方公尺'],1,'先求直徑 2×5＝10，再乘 π。答案單位為公尺。']]},
 {id:'english',name:'英文',scope:'翰林 Here We Go 9 · Unit 3',title:'What Would You Like to Eat?',color:'#655293',teach:[['核心問答','What would you like to eat? → I’d like …, please. 把問題和回答成對練，不只背單字。'],['would like','I’d 是 I would 的縮寫；would like 後面接想要的食物。問同伴可說 Would you like …?'],['聽讀策略','先聽關鍵食物詞，再分辨問的是想吃什麼、要不要某樣食物；回答要對應問題，不憑圖片猜。'],['拼字與量詞','食物拼字要看課本單字表；若課本出現 a bowl of 等量詞，連量詞和食物一起記。']],qs:[['A: What would you like to eat? 哪句回答最合適？',['I’d like some noodles, please.','I went noodles yesterday.','I am like noodles.','I likes noodles.'],0,'問想吃什麼，用 I’d like… 回答；其他選項時態或句型不合。'],['“Would you like some juice?” 表示想要的回答？',['Yes, please.','Yes, I did.','I am juice.','No, I do yesterday.'],0,'Would you like…? 可用 Yes, please. 表示接受。'],['選出正確句子：',['What would you like to eat?','What you would like eat?','What did would you like?','What are you like eat?'],0,'固定問句是 What would you like to eat?'],['要禮貌地說「我想要一碗湯」，句子開頭選？',['I’d like …, please.','I did like … yesterday.','I likes …','I am like …'],0,'I’d like 是 I would like 的縮寫，搭配 please 更有禮貌。'],['同學回答 “I’d like a sandwich.” 他表達的是？',['他昨天吃了三明治','他想要三明治','他不喜歡三明治','他正在做三明治'],1,'would like 表達想要；不是過去式，也不是正在進行。']]},
 {id:'social',name:'社會',scope:'南一六上第三單元',title:'戰後臺灣的經濟與城鄉發展',color:'#bd672d',teach:[['先排年代','依課本整理戰後不同階段的產業與生活變化。先看年代，再談原因，避免把前後階段混成同時發生。'],['把因果說完整','練習「產業變化 → 工作機會改變 → 人口移動／城鄉生活改變」。每一步都要有課文或圖表線索。'],['讀圖表四步','讀標題 → 看年份與單位 → 找圖例 → 比較數值。比例增加只代表占比提高，不等於每個人都如此。'],['期中弱點怎麼補','期中社會失分集中在政府分工和資料推論。本單元改練讀資料、分清統計範圍、避免從少數例子推論全體。']],qs:[['圖表顯示某產業占比由 20% 升至 35%，可以確定什麼？',['每個人收入都增加','該產業占圖表總量的比例上升','人口一定增加','其他產業完全消失'],1,'占比上升不等於總量或每個人的收入必然增加。'],['要解釋產業變遷如何影響城鄉，哪個說法較完整？',['產業改變工作機會，進而影響人口移動和生活','城市變大，所以所有鄉村消失','只列年份就等於解釋原因','用一個家庭代表全臺灣'],0,'說明中間環節，並用課文資料支持因果。'],['比較兩個年代的統計圖，先確認什麼？',['年份、對象、單位和比例基準','柱子顏色','哪根柱子看起來最高','圖表有幾種顏色'],0,'比較前需確認統計口徑一致，才知道差異是否可比。'],['表格只有某城市的資料，哪個結論不應直接下？',['該城市這幾年的數值變化','表格中最高與最低的年份','全臺灣每個城市都出現相同變化','資料範圍是這一城市'],2,'單一城市不能直接代表全臺灣所有城市。'],['找歷史變化原因時，哪個證據最有用？',['課文中同時說明政策／產業改變和生活影響的資料','自己猜測哪種工作較好','只看圖片顏色','只背一個年代'],0,'原因和影響要能連起來，不能只靠猜或孤立年份。']]},
 {id:'science',name:'自然',scope:'康軒六上第三單元',title:'動物大解密',color:'#34748c',teach:[['動物如何運動','骨骼提供支撐，肌肉收縮拉動骨骼，關節讓骨骼能活動。觀察動物時比較構造和運動方式。'],['動物如何呼吸','不同動物以適合自身構造的器官交換氣體。答題先辨認題目中的動物，再對照課本所學器官，別把人的呼吸方式套給所有動物。'],['動物與生活','課本會連結動物和人類生活。分清楚觀察到的用途、可能的影響，以及保護動物與環境的考量。'],['期中弱點怎麼補','期中自然卷顯示「觀察到什麼」和「能證明什麼」要分清。這次練習每個結論都回扣構造、圖表或實驗條件。']],qs:[['手肘彎曲時，主要是什麼拉動骨骼？',['肌肉收縮','血液流動','皮膚變長','骨頭自己變長'],0,'肌肉收縮會拉動骨骼，關節讓骨骼能彎曲活動。'],['比較兩種動物的運動方式，哪種紀錄最有用？',['記下可觀察的肢體動作和移動方式','只寫牠看起來很快樂','猜牠最喜歡的環境','只抄動物名稱'],0,'可觀察的動作能當證據；情緒或喜好是推測。'],['研究不同鳥喙與取食方式，哪種比較較公平？',['食物和時間相同，記錄不同喙取食情形','每種鳥用不同食物和時間','只記最成功的一次','先決定答案再挑觀察'],0,'控制其他條件，才能把差異和鳥喙特徵做合理比較。'],['觀察到某動物腳掌有蹼，哪個結論較恰當？',['蹼可能有助水中移動，還要配合其他觀察','所有有蹼動物都住同一水域','牠一定只吃魚','有蹼就不會遇到天敵'],0,'構造可提出功能假設，但不能超出觀察證據。'],['哪句是觀察紀錄而非猜測？',['牠一定很害怕','牠想討好同伴','一分鐘內牠用前肢抓取食物四次','牠覺得這裡舒服'],2,'動作和次數可直接記錄；害怕、討好、舒服是推測。']]}
];
FINAL_SUBJECTS.find(s=>s.id==='math').title='比與比值 × 扇形弧長與面積';
FINAL_SUBJECTS.find(s=>s.id==='math').teach=[['比先排順序','先標註每個數代表誰，統一單位，再列比；不能顛倒前項、後項。'],['比值與等值比','比值是前項除以後項；等值比兩項同乘或同除相同非零數，最後化為最簡整數比。'],['用比解題','依題意排成同一順序求未知量，完成後代回原題驗算。'],['扇形弧長與面積','圓心角占360°的幾分之幾，弧長和面積就各占整圓周長與面積的同一比例。'],['單位檢查','弧長用長度單位，面積用平方單位；答案應小於整圓對應值。']];
FINAL_SUBJECTS.find(s=>s.id==='social').teach=[['整理時序','依第三單元課本整理戰後不同時期的產業與生活變化，分清年代、政策、產業和結果。'],['說清因果','把產業、工作機會、人口移動與生活變化連起來，說出中間原因。'],['讀圖表四步','先看標題年份，再讀單位圖例，接著比較數值，最後檢查結論範圍；比例不等於人數。'],['期中弱點調整','期中政府分工題失分集中，也有把局部資料說成全部的風險。本單元加強證據步驟，但不放入期中單元題目。']];
FINAL_SUBJECTS.find(s=>s.id==='science').teach=[['構造與運動','比較動物構造、動作和環境，以觀察支持功能解釋，避免從單一構造推定全部生活方式。'],['呼吸構造','依第三單元課本整理呼吸構造與氣體交換，分清器官、環境和呼吸作用。'],['觀察與推論','先記錄看得到、量得到的現象，再寫可能解釋；比較時控制食物、時間和環境等條件。'],['期中弱點調整','期中自然在相近概念、實驗圖表和證據範圍較不穩，因此加強觀察、讀表與不同問法驗收。']];
const FINAL_EXTRA_QUESTIONS={chi:[['比較第7–10課，哪種筆記最有助看出異同？',['每課抄滿一頁','按主題、證據、寫法做對照表','只記作者姓名','只抄課文標題'],1,'用相同面向並列，才能比較文章。'],['「雖然……但是……」提示什麼關係？',['轉折或讓步','時間先後','列舉同類','數量相加'],0,'這組關聯詞提示前後意思轉折。'],['題目問作者如何描寫場景，應優先找？',['感官細節和動作','生字筆畫數','頁碼','無關背景知識'],0,'感官細節和動作常用來建立場景。'],['摘要一段應優先保留？',['核心觀點及代表性證據','每個形容詞','所有對話','旁枝細節'],0,'摘要保留核心訊息，省略不必要細節。'],['一位受訪者表達喜歡某地，能確定什麼？',['所有居民都喜歡','這位受訪者喜歡','地方沒有問題','人人感受相同'],1,'結論範圍應與證據對應。']],math:[['4公尺：300公分化成最簡整數比？',['4：300','4：3','3：4','4：30'],1,'4公尺等於400公分，400：300化簡為4：3。'],['甲：乙＝2：3，共25個，乙有幾個？',['10','15','20','5'],1,'共5份，每份5個；乙有3份。'],['半徑6公分、90°扇形弧長？π=3.14',['9.42公分','18.84公分','28.26公分','37.68公分'],0,'整圓周長37.68，四分之一是9.42。'],['半徑4公分、180°扇形面積？π=3.14',['25.12平方公分','50.24平方公分','12.56平方公分','100.48平方公分'],0,'整圓面積50.24，半圓是25.12平方公分。'],['扇形周長包含？',['弧長和兩條半徑','只有弧長','只有兩條半徑','整圓面積'],0,'扇形周長是弧長加兩條半徑。']],english:[['「一碗飯」哪個片語正確？',['a bowl of rice','a piece of rice','a rice of bowl','a bowl rice of'],0,'a bowl of + 食物表示一碗。'],['What would you like to drink? 哪個回答合適？',['We’d like two glasses of juice.','I went juice yesterday.','Yes, I did.','At the park.'],0,'問想喝什麼，回答飲料並使用正確量詞。'],['有禮貌地婉拒 “Would you like some soup?”',['No, thank you.','No, I didn’t.','I am soup.','Where soup?'],0,'No, thank you. 是婉拒邀請的自然說法。'],['Unit 3 的 kn- 字首，k 通常如何發音？',['不發音','發/k/音','發/n/音','發/g/音'],0,'本單元 phonics 的 kn- 字首中，k 不發音。'],['“I’d like a piece of cake.” 中 I’d 表示？',['I would','I did','I had','I am'],0,'I’d 在這個句型中是 I would 的縮寫。']],social:[['產業占比由20%升到35%，增加幾個百分點？',['15','15%的人','55','75'],0,'35減20是15個百分點。'],['比較兩地產業比例前先核對？',['年份、分類定義和統計方式','圖表顏色','標題字體','紙張方向'],0,'資料口徑一致才能公平比較。'],['農業就業比例下降代表？',['比例降低，不代表農業消失','農業從此不存在','農民全搬走','不再需要農產品'],0,'比例下降不等於產業消失。'],['工業區增加工作機會，較合理推論？',['可能吸引部分人口移入，還要查資料','每人收入必定增加','全縣人口都移入','農村人口歸零'],0,'說明可能機制，並用資料驗證。'],['表格只列某城市資料，不能直接說？',['該市表列趨勢','全臺城市都完全相同','該市年度差異','表內數值變化'],1,'單一城市資料不能代表全臺。']],science:[['哪句是觀察而非猜測？',['牠一定害怕','一分鐘抓取食物四次','牠想討好同伴','牠覺得舒服'],1,'動作和次數可直接觀察，心情是推測。'],['比較鳥喙模型取食能力，哪種安排公平？',['食物和時間相同，只換模型','各用不同食物和時間','只記最好一次','先決定答案'],0,'一次只改變研究因素，控制其他條件。'],['動物有蹼，較妥當的推論？',['可能有助划水，還需觀察驗證','都住同一水域','一定只吃魚','不會遇到天敵'],0,'由構造提出假設，須以觀察驗證。'],['研究動物呼吸，哪項資料最相關？',['呼吸構造與氣體交換','身體顏色','跑步速度','喜歡的天氣'],0,'呼吸研究要看相關構造和氣體交換。'],['觀察三隻動物都用前肢抓食物，能確定？',['這三隻都有抓取行為','所有動物都用前肢','永遠只用前肢','都住同一環境'],0,'結論範圍應與觀察樣本一致。']]};

${sourceHtml()}`;updateTop();updateDrillAvailability();updateCatalog();}
function cardHtml(l){const n=data.stats[l.id]||{seen:0,correct:0};const done=!!data.done[l.id];const p=n.seen?pct(n.correct/n.seen):0;return`<article class="lesson-card" style="--accent:${subjectColor(l.subject)}"><div class="card-top"><span class="subject-tag">${l.subject} · ${l.unit}</span>${done?'<span class="done-mark">✓ 已完成</span>':''}</div><h3>${esc(l.title)}</h3><p class="sub">${esc(l.sub)}</p><div class="card-bottom"><span class="progress-label">${n.seen?`練習 ${n.seen} 題 · ${p}% 正確`:'重點卡 × 3'}</span><button class="button button-small" data-lesson="${l.id}">${done?'再複習':'開始複習'} →</button></div><div class="tiny-progress"><i style="width:${p}%;background:${subjectColor(l.subject)}"></i></div></article>`}
function examCardsHtml(){return Object.entries(EXAMS).map(([id,x])=>`<article class="exam-card"><div><div class="exam-icon" aria-hidden="true">${id==='mix-quiz'?'✳':id==='chi-quiz'?'文':id==='sci-quiz'?'⚗':id==='eng-quiz'?'ABC':id==='math-quiz'?'數':id==='idiom-quiz'?'成':'史'}</div><h3>${esc(x.title)}</h3><p>${esc(x.desc)}</p><p class="fineprint">題庫 ${x.questions.length} 題，每回合抽 ${Math.min(20,x.questions.length)} 題。</p></div><button class="button button-small" data-exam="${id}">開始挑戰 →</button></article>`).join('')+`<article class="exam-card"><div><div class="exam-icon" aria-hidden="true">✎</div><h3>錯題再挑戰</h3><p>${Object.values(data.wrong).reduce((s,a)=>s+a.length,0)} 題等你回來拆解；做對就能收復知識。</p></div><button class="button button-small" data-action="wrong-quiz">前往複習 →</button></article>`}
function sourceHtml(){return catalogHtml()}
function renderLesson(id){if(id==='idiom-world'){location.hash='idioms';return renderIdioms();}if(id.startsWith('eng-')){location.hash='english/'+id;return renderEnglish(id);}const l=LESSONS.find(x=>x.id===id);if(!l)return renderHome();const stats=data.stats[id]||{seen:0,correct:0};main.innerHTML=`<div class="detail-head"><button class="back-button" data-action="home">← 回探索地圖</button><div><div class="detail-kicker">${l.subject} · ${l.unit} · ${l.sub}</div><h1>${esc(l.title)}</h1></div></div><div class="detail-layout"><section class="detail-main" style="--accent:${subjectColor(l.subject)}"><div class="goal-box"><strong>這一站的任務</strong><p>${esc(l.goal)}</p></div>${l.subject==='國語'?`<div class="lesson-vocab-link"><a class="button button-small" href="#vocab/${l.id}">✎ 本課生字・注音・默寫（${VOCAB_WORDS.filter(w=>w.lessonId===l.id).length} 字） →</a></div>`:''}<h2>今天要記住的重點</h2><div class="point-list">${l.points.map((p,i)=>`<article class="point"><span class="point-num">0${i+1}</span><div><h3>${esc(p[0])}</h3><p>${esc(p[1])}</p></div></article>`).join('')}</div><div class="detail-test"><h2>準備好了嗎？</h2><p class="aside-copy">${stats.seen?`已練習 ${stats.seen} 題，答對 ${stats.correct} 題。`:''}用 ${l.questions.length} 題檢查看看自己抓到線索了沒。</p><button class="button" data-exam="lesson:${id}">開始本課小測 →</button></div></section><aside class="detail-aside"><h2 class="aside-title">記憶翻翻卡</h2><p class="aside-copy">先自己想答案，再翻開檢查。</p><div class="flashcard" id="flashcard" aria-live="polite"></div><div class="flash-actions"><button data-action="card-prev">← 上一張</button><button data-action="card-flip" id="flipButton">翻開答案</button><button data-action="card-next">下一張 →</button></div><p class="aside-copy" style="margin-top:17px">一個小提示：說出自己的例子，記得會更牢。</p></aside></div>`;session={cardId:id,cardIndex:0,flipped:false};updateCard()}
function updateCard(){if(!session?.cardId)return;const l=LESSONS.find(x=>x.id===session.cardId),card=l.cards[session.cardIndex];const el=document.querySelector('#flashcard');if(!el)return;el.innerHTML=`<span class="card-index">記憶卡 ${session.cardIndex+1} / ${l.cards.length}</span><span class="card-question">${esc(card[0])}</span>${session.flipped?`<span class="card-answer">${esc(card[1])}</span>`:''}`;const b=document.querySelector('#flipButton');if(b)b.textContent=session.flipped?'再想一次':'翻開答案'}
function normalizeQuestion(q){const normalized=Array.isArray(q)?{q:q[0],options:q[1],answer:q[2],explain:q[3],lessonId:q.lessonId}:{...q};if(!normalized.lessonId||normalized.lessonId==='unknown')normalized.lessonId=findLessonForQuestion(normalized);const canonical=QUESTION_BANK.find(x=>x.q===normalized.q);return {...canonical,...normalized,id:normalized.id||canonical?.id||normalized.q}}
function beginDailyExam(){startExam('daily-quiz',DRILL.select(QUESTION_BANK,5,data.seen),'混合','隨機 5 題挑戰')}
function beginNamedExam(id){if(id.startsWith('idiom:'))return launchIdiomExam(...id.split(':').slice(1));if(id==='idiom-quiz')return launchIdiomExam('all','mix','20');if(id.startsWith('english:'))return launchEnglishExam(...id.split(':').slice(1));if(id.startsWith('vocab:')){const [,lesson,kind,count]=id.split(':');return launchVocabExam(lesson,kind,count);}if(id==='drill-quiz')return beginDrill();if(id.startsWith('paper:')){const p=PAPERS.find(p=>p.id===id.slice(6));return startExam(id,DRILL.select(QUESTION_BANK.filter(q=>q.sourceId===p.id),20,data.seen),p.subject,p.school+' · 考點延伸')}if(id==='daily-quiz')return beginDailyExam();if(id==='wrong-quiz'){const qs=Object.entries(data.wrong).flatMap(([k,list])=>list.map(q=>({...normalizeQuestion(q),lessonId:k})));return startExam(id,qs,'混合','錯題再挑戰')}const ex=EXAMS[id];if(ex)startExam(id,DRILL.select(ex.questions,20,data.seen),ex.subject,ex.title+' · 20 題')}
function beginLessonTest(id){const l=LESSONS.find(x=>x.id===id);startExam('lesson:'+id,[...l.questions],l.subject,`${l.title}・本課小測`)}
function findLessonForQuestion(q){const text=Array.isArray(q)?q[0]:q.q;return LESSONS.find(l=>l.questions.some(x=>(Array.isArray(x)?x[0]:x.q)===text))?.id||'unknown'}
function saveWrong(id,q){const list=data.wrong[id]||(data.wrong[id]=[]);if(!list.some(x=>x.q===q.q))list.push({...q})}
function removeWrong(q){const id=q.lessonId||findLessonForQuestion(q),list=data.wrong[id]||[];const idx=list.findIndex(x=>x.q===q.q);if(idx>=0)list.splice(idx,1);if(!list.length)delete data.wrong[id];else data.wrong[id]=list}
function renderResult(){const s=session,total=s.items.length,score=s.correct,rate=pct(score/total),level=Math.floor((data.xp||0)/100)+1;const badge=rate===100?'✨ 完美通關！':rate>=70?'🌟 好眼力！':rate>=40?'🧭 找到新線索！':'🌱 練習讓實力長大';const unseen=QUESTION_BANK.filter(q=>!data.seen[q.id]).length;main.innerHTML=`<section class="exam-shell"><div class="result-box"><div class="result-score">${score} / ${total}</div><h1>${level>s.levelBefore?"🎉 升級了！ ":""}${badge}</h1><p>每個弄懂的理由，都是下一次答對的線索。</p><div class="result-training"><strong>⚡ 本回合 +${s.xpEarned} XP</strong><span>🔥 最長連對 ${s.bestCombo} 題</span><span>🏅 Lv.${level} ${trainingRank(level)}</span></div><p>題庫還有 ${unseen} 題未練習 · 連續複習 ${data.streak} 日</p><div class="result-actions"><button class="button" data-exam="${esc(s.examId)}">${s.examId==='wrong-quiz'?'再練剩下錯題':'下一回合 · 未做過優先'}</button>${s.items.some(q=>q.idiomId)?'<a class="button button-small" href="#idioms">回成語天地看星星</a>':''}<button class="button button-small" data-action="home">回探索地圖</button><a class="button button-small" href="#mistakes">錯題寶箱</a></div></div>${reviewHtml(s)}</section>`;saveData();updateTop();window.scrollTo(0,0)}
function renderMistakes(){const entries=Object.entries(data.wrong).flatMap(([id,qs])=>qs.map(q=>({id,q})));main.innerHTML=`<div class="detail-head"><button class="back-button" data-action="home">← 回探索地圖</button><div><div class="detail-kicker">MISTAKE TREASURE CHEST</div><h1>錯題寶箱</h1></div></div>${entries.length?`<div class="section-header"><p>每一題錯題都是一張尋寶地圖。再挑戰一次，答對就能把它收復。</p><button class="button" data-action="wrong-quiz">開始重練 ${entries.length} 題 →</button></div><div class="wrong-list">${entries.map(({id,q})=>`<article class="wrong-item"><div class="card-top"><span class="subject-tag">${esc(LESSONS.find(l=>l.id===id)?.title||id)}</span><span class="done-mark">正解 ${q.type==='text'?esc(q.expected):String.fromCharCode(65+q.answer)}</span></div><h3>${esc(q.q)}</h3><p>正確答案：${esc(q.options[q.answer])}</p>${q.selectedAnswer&&(q.type==='text'||q.options.includes(q.selectedAnswer))?learningFeedback(q,q.type==='text'?q.selectedAnswer:q.options.indexOf(q.selectedAnswer)):`<p>${esc(q.explain)}</p>`}${questionSourceHtml(q)}</article>`).join('')}</div>`:`<div class="empty-state"><div style="font-size:30px">🏝️</div><h2>寶箱還是空的</h2><p>去闖一個小測驗，答錯的題目會自動放進來；答對後可以收復它們。</p><button class="button" data-action="home">去探索地圖</button></div>`}`}
function renderSettings(){main.innerHTML=`<div class="detail-head"><button class="back-button" data-action="home">← 回探索地圖</button><div><div class="detail-kicker">YOUR LOCAL LEARNING RECORD</div><h1>進度備份與設定</h1></div></div><section class="settings-panel"><div class="goal-box"><strong>隱私說明</strong><p>學習紀錄只存於目前這個瀏覽器，不會送到網站或 GitHub。要在別的裝置接續，請匯出備份後再匯入。</p></div><h2>學習統計</h2><p>完成主題 ${Object.keys(data.done).length} / ${LESSONS.length} · 答題 ${data.totalAnswered} · 答對 ${data.totalCorrect} · 錯題 ${Object.values(data.wrong).reduce((n,x)=>n+x.length,0)}</p><div class="settings-actions"><button class="button" data-action="export">匯出學習備份</button><button class="button" data-action="import">匯入學習備份</button><button class="button" data-action="reset">清除本機紀錄</button></div><input id="importFile" type="file" accept="application/json" hidden><h2>資料備份文字</h2><textarea id="backupText" aria-label="學習備份 JSON" placeholder="匯出後會出現備份文字，也可以貼上備份後匯入"></textarea><div class="settings-actions" style="margin-top:8px"><button class="button button-small" data-action="export-text">顯示備份文字</button><button class="button button-small" data-action="import-text">匯入文字備份</button></div><p>只匯入複習小島自己匯出的 JSON 檔案或文字。</p></section>`}
function homeAndScroll(id){session=null;history.replaceState(null,'',id||'#home');renderHome();if(id)requestAnimationFrame(()=>document.querySelector(id)?.scrollIntoView({behavior:'smooth'}))}
function route(){updateTop();const hash=decodeURIComponent(location.hash||'#final-review');if(hash==='#settings')return renderSettings();if(hash==='#final-review'||hash==='#home')return renderFinalReview();if(hash!=='#final-review'){location.hash='#final-review';return}renderFinalReview()}
function exportJson(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='review-island-progress.json';a.click();URL.revokeObjectURL(a.href);notify('備份檔已下載！')}
function importData(value){try{const x=JSON.parse(value);if(!x||typeof x!=='object'||!x.stats||!x.wrong)throw Error();data={...blank(),...x};saveData();notify('學習進度已匯入！');renderSettings()}catch{notify('檔案格式不正確，請使用本站匯出的備份。')}}
document.addEventListener('click',e=>{const filterBtn=e.target.closest('[data-filter]');if(filterBtn){filter=filterBtn.dataset.filter;renderHome();return}const lessonBtn=e.target.closest('[data-lesson]');if(lessonBtn){location.hash='lesson/'+lessonBtn.dataset.lesson;return}const examBtn=e.target.closest('[data-exam]');if(examBtn){const id=examBtn.dataset.exam;if(id.startsWith('lesson:'))beginLessonTest(id.slice(7));else beginNamedExam(id);return}const ans=e.target.closest('[data-answer]');if(ans){answer(Number(ans.dataset.answer));return}const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;switch(action){case'home':session=null;homeAndScroll();break;case'random':beginDailyExam();break;case'prev-question':goQuestion(session.index-1);break;case'next-question':goQuestion(session.index+1);break;case'confirm-answer':confirmAnswer();break;case'finish-exam':finishExam();break;case'exit-exam':session=null;homeAndScroll('#exams');break;case'wrong-quiz':beginNamedExam('wrong-quiz');break;case'card-flip':session.flipped=!session.flipped;updateCard();break;case'card-next':{const l=LESSONS.find(x=>x.id===session.cardId);session.cardIndex=(session.cardIndex+1)%l.cards.length;session.flipped=false;updateCard()}break;case'card-prev':{const l=LESSONS.find(x=>x.id===session.cardId);session.cardIndex=(session.cardIndex+l.cards.length-1)%l.cards.length;session.flipped=false;updateCard()}break;case'export':exportJson();break;case'export-text':document.querySelector('#backupText').value=JSON.stringify(data);notify('備份文字已準備好。');break;case'import-text':importData(document.querySelector('#backupText').value);break;case'import':document.querySelector('#importFile').click();break;case'reset':if(confirm('確定清除這個瀏覽器裡的所有學習進度和錯題嗎？')){data=blank();saveData();renderSettings()}break;}});
document.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0]){const r=new FileReader();r.onload=()=>importData(r.result);r.readAsText(e.target.files[0])}});
window.addEventListener('hashchange',route);route();

</script>
</body></html>
